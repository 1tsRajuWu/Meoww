services:
  - type: web
    # **The name Render matches a Blueprint sync *on*, which is deliberately not
    # the address anybody reaches this service at.** Render looks for a service
    # with the declared name, updates it if it finds one, and creates a new one if
    # it does not — so this field decides whether a sync adopts the service that
    # runs the bot or mints a stranger beside it. It said `meow-discord-bot` here,
    # which is the service's *address* (`meow-discord-bot.onrender.com`, the
    # subdomain it was created with): no service in the account had that name, the
    # account's bot service is named **Meoww**, and so a Blueprint sync created
    # `meow-discord-bot-fmhp` next to the real one. That duplicate had no
    # environment variables — nobody ever answered the prompts below for it — so
    # every deploy it was ever given ended at boot in
    # `RuntimeError: DISCORD_TOKEN not found`, Render never ran an instance on it,
    # and it was deleted by hand on 2026-09-23. Naming the service that exists is
    # what makes adoption possible; the address belongs in `DASHBOARD_BASE_URL`
    # and in the docs, which is where every other reference to it already lives.
    name: Meoww
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: VIP_BOT_TOKEN
        sync: false
      # The application's client id, which is **public**: it appears in every
      # invite link anybody can read, so it lives here rather than in the
      # dashboard's secret list. Without it the landing page omitted its
      # "Add to Discord" button entirely — the templates drop the button when the
      # id is unknown, so the live site had no way to add the bot and nothing
      # anywhere said so. Discord sign-in stays off until the *secret* is set
      # too; it needs both, and the login page says so.
      - key: DISCORD_CLIENT_ID
        value: "1548380269776605324"
      # The other half of Discord sign-in, and a real secret — it is what
      # completes the OAuth code exchange, so it is a prompt and never a value.
      #
      # Its absence is why the dashboard's third way in has been switched off in
      # production: `discord_auth.enabled()` needs **both** halves, and while the
      # live sign-in page has been saying so in a sentence, nothing told the
      # deploy to ask for it. This is the same omission that once left
      # FLASK_SECRET_KEY and ADMIN_PASSKEY undeclared — a feature that is
      # configured in `.env.example` and documented in the README, silently off
      # on the host, with the only symptom being a login method that never
      # appears. Register the callback URL the sign-in page prints:
      #   {DASHBOARD_BASE_URL}/login/discord/callback
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Sign-in state is signed with this key. Without it the dashboard invents a
      # new one on every boot, so every deploy — and every wake-up from Render's
      # free-tier sleep — signs the administrator out and silently kills any
      # one-time link they were holding.
      - key: FLASK_SECRET_KEY
        sync: false
      # Without it passkey sign-in is disabled outright, and the only way in is
      # the ⚡ Open Dashboard button on /help in Discord, which needs the bot to
      # be awake to answer.
      - key: ADMIN_PASSKEY
        sync: false
      # The passkey is what opens the operator console. Without this switch the
      # Discord sign-in is a sign-in and nothing more, however the account is
      # identified: an owner whose Discord id is configured still has to type the
      # passkey, because a button that skips it is a console with no door.
      - key: OWNER_DISCORD_ELEVATION
        value: "1"
      # Shared with the owner site's build so the worker can name the visitor it
      # forwarded. The same value must be set for the Cloudflare Pages build
      # (scripts/build_owner.py in its build command) and here. Blank is a
      # supported state: sign-in limits on the owner host then share one bucket.
      - key: OWNER_PROXY_SECRET
        sync: false
      # The paid tiers, as Lemon Squeezy hosted checkout URLs (product -> Share
      # -> Copy link). They are rendered into /pricing for anyone to click, so
      # they are public in the same way the client id is — a prompt rather than a
      # literal here only because each one belongs to a store. Left blank,
      # /pricing says "No billing yet" and keeps every button on the invite page.
      # Filling them in does not start selling: PLAN_CHECKOUT does that.
      - key: LEMONSQUEEZY_CHECKOUT_PRO
        sync: false
      - key: LEMONSQUEEZY_CHECKOUT_ENTERPRISE
        sync: false
      # Whether the plans can be *bought*. A switch, not a credential, so its
      # value is committed: buying is off, and stays off while the store is set
      # up, however many checkout URLs are configured. No host shows a Buy button
      # until this is 1 — the tiers are still described on /pricing.
      - key: PLAN_CHECKOUT
        value: "0"
      # Whether a licence is *required* for the paid systems. It is a switch, not
      # a credential, so its value is committed: the deploy has a definite state
      # (plans recorded and shown, nothing withheld) instead of a prompt somebody
      # has to answer the same way every time. Set it to 1 when the tiers should
      # be real.
      - key: PLAN_ENFORCEMENT
        value: "0"
      # The monitors the dashboard's status panel reads. UptimeRobot is already
      # watching this host if a monitor points at it; the **read-only** key
      # (My Settings -> API Settings -> Read-Only API Key) is what turns the panel
      # from "not read yet in this process" into the history this host has
      # actually had — and what makes `/health` able to answer whether the bot has
      # been up *lately*, not merely whether it is up now.
      #
      # It is declared here because of the omission this manifest keeps being
      # caught by: a setting that is documented in `.env.example` and read by the
      # code, but never offered by the deploy, is a feature that is simply off on
      # the host with no error anywhere to show for it. Optional rather than
      # essential — with no key the panel says so in a sentence.
      - key: UPTIMEROBOT_API_KEY
        sync: false
      # Optional: a public UptimeRobot status page for visitors who are not
      # signed in. No value, no link.
      - key: UPTIMEROBOT_STATUS_PAGE
        sync: false
      # When a deploy announces itself. This is a switch plus a clock, and the
      # pair is the answer to the same complaint: the notes are the bot talking
      # about itself in a channel it is in, and a note that arrives at 14:20
      # arrives in a working day. `UPDATE_WINDOW_IST` keeps the notes and moves
      # them to the small hours (three times a few minutes apart, because a free
      # instance can be asleep at the first); a boot outside the window records
      # nothing, so the note is still owed and goes out complete.
      #
      # `SILENT_UPDATES=0` is the other half of that pair, not its absence: with
      # the window in place the notes are quiet, so the switch is left off — set
      # it to 1 to stop them *entirely*, which is the only setting that leaves a
      # server's update channel permanently empty. `/bot push` posts a note on
      # demand either way, because a person asking is not what is being
      # silenced.
      - key: UPDATE_WINDOW_IST
        value: "03:33,04:00,04:44"
      - key: SILENT_UPDATES
        value: "0"
      # --- voice / ffmpeg --------------------------------------------------------
      # Nothing here is required, because nothing here is set — and since the radio
      # was archived (2026-10-06, see ``deleted_features/README.md``) the audio path
      # is dormant rather than gone: ``imageio-ffmpeg`` (a dependency) still ships a
      # static ffmpeg so a host that cannot apt-get anything can decode, and the
      # Dockerfile next to it is the *upgrade* (a real ffmpeg and libopus0, i.e.
      # volume that changes mid-track instead of re-rendering the stream) rather than
      # a precondition. ``utils/voice_caps.py`` is what reports which of the two this
      # deployment is, through the boot line and ``/api/voice-debug``.
      #
      # This block used to prompt for three credentials — a cookie jar, a PO token
      # and visitor data — because a media platform refusing a datacenter address
      # was the one failure that could not be designed away. The extractor they
      # were the answer to is gone (see ``deleted_features/README.md``), and a
      # manifest that still asks for them is worse than clutter: an operator who
      # fills them in has configured nothing, and no run of the bot will ever read
      # them. The one setting left that anything reads — ``MEOW_FFMPEG`` — is
      # deliberately not declared here: it exists to override a default that is
      # already right on this host (ffmpeg from ``imageio-ffmpeg``), and a prompt
      # is where a default gets overwritten by somebody answering a question they
      # had no reason to be asked. It is declared in ``utils/config_audit.py`` —
      # the one list of what this bot reads — and reported by ``/api/config``, so
      # the host where the default *is* wrong can set it as an ordinary
      # environment variable without a prompt standing in the way.
      # --- out-of-band alerts ----------------------------------------------------
      # A second webhook, for the events a channel *inside a server* cannot
      # receive: the bot was just added (so it is in none of that server's
      # channels yet), the gateway is down (which is why the web process is
      # answering), or the web surface is being flooded. Plain HTTP from a thread,
      # posted silently, bounded to one message per kind per 30 seconds and 120
      # per process — the thing watching a flood must not be the amplifier.
      #
      # Declared here for the reason every setting on this file is: one that the
      # code reads and the deploy never offers is a feature that is off on the
      # host with no error to show for it. What it receives is listed in full in
      # PRIVACY.md section 5 and TERMS.md section 12.
      - key: ALERT_WEBHOOK_URL
        sync: false
  - type: web
    # The VIP bot: the same code, the other identity. Declared 2026-10-14
    # because this service existed on the dashboard with no blueprint entry,
    # so no sync ever prompted for its token and every one of its deploys died
    # at boot in `RuntimeError: DISCORD_TOKEN not found` — the exact shape the
    # `meow-discord-bot-fmhp` duplicate took in the note above. Naming it here
    # is what makes the next Blueprint sync adopt it (Render matches by name)
    # and ask for the values below instead of deploying it empty again.
    name: meoww-premium
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # **The VIP application's token** — not the main bot's. `bot.py` reads
      # `DISCORD_TOKEN` first and `VIP_BOT_TOKEN` second, so answering either
      # prompt starts this service; answering with the main token would log in
      # as the wrong bot and fight the `Meoww` service over commands. Tokens
      # are per service: the entry above keeps its own.
      - key: DISCORD_TOKEN
        sync: false
      # The same credential under its own name, for operators who keep both
      # bots' tokens side by side. Either this or `DISCORD_TOKEN` starts the
      # service; neither set is the red deploy on the dashboard today.
      - key: VIP_BOT_TOKEN
        sync: false
      # The VIP application's client id — public, like the main one above, and
      # **different** from it: the invite links and Discord sign-in on this
      # host are built from it, so the main id here would invite the wrong bot.
      - key: DISCORD_CLIENT_ID
        value: "1558691012975534222"
      # The rest mirrors the main service: one process, two identities, and a
      # prompt answered differently on the two hosts is a behaviour answered
      # differently. The shared secrets (backup bucket, session key, passkey,
      # proxy stamp) must hold the **same** values here as there — the two
      # processes back up one database and sign into one dashboard.
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: ADMIN_PASSKEY
        sync: false
      - key: OWNER_PROXY_SECRET
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: UPTIMEROBOT_API_KEY
        sync: false
      - key: UPTIMEROBOT_STATUS_PAGE
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: LEMONSQUEEZY_CHECKOUT_PRO
        sync: false
      - key: LEMONSQUEEZY_CHECKOUT_ENTERPRISE
        sync: false
      # **The Dev Cat's chat half, which is a deployment switch and nothing
      # else.** The toy in `cogs/devtoy.py` reacts to, and answers, what people
      # type in the developer's server — and Discord sends a bot no message text
      # at all without the privileged Message Content intent. Two things have to
      # be true for that: this variable, and the intent enabled on **this
      # application** in the Developer Portal (the VIP app — the intent is per
      # application, not per bot token). With neither, everything else about the
      # toy works and the cat simply never answers; `drop_ungranted_intents`
      # prints which one is missing at boot rather than failing the connection.
      #
      # Declared rather than left to the dashboard, for the reason this manifest
      # has been caught by before: an undeclared variable is never *prompted*
      # for, so a Blueprint sync deploys it empty and the feature is off with
      # nothing anywhere to say so. The Space running this token today needs the
      # same value in its own settings.
      - key: ENABLE_MESSAGE_CONTENT_INTENT
        value: "1"
      # **The cat's brain, which is optional on purpose.** Unset, the Dev Cat is
      # answered by a public keyless model and the toy is complete; set, it is
      # answered by this deployment's own endpoint instead (the VIP Space is the
      # host that runs the cog, so the value belongs in *its* settings too). A
      # prompt rather than a value because it is a credential, and blank rather
      # than invented because there is a working default behind it.
      #
      # `CAT_AI_URL` and `CAT_AI_MODEL` are deliberately **not** declared here.
      # Their defaults live in one home — `utils/catfeed` — and a manifest that
      # restated them would be a second home that drifts from the first; a host
      # pointing the cat at a different endpoint sets all three itself (see
      # `.env.example`). Declaring them as literals would also trip
      # `tests/test_dashboard.py`'s committed-value law, which is right to treat
      # any literal in this file as configuration somebody has to look at.
      - key: CAT_AI_KEY
        sync: false
      - key: OWNER_DISCORD_ELEVATION
        value: "1"
      - key: PLAN_CHECKOUT
        value: "0"
      - key: PLAN_ENFORCEMENT
        value: "0"
      - key: UPDATE_WINDOW_IST
        value: "03:33,04:00,04:44"
      - key: SILENT_UPDATES
        value: "0"
