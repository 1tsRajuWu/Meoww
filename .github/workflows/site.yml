name: Site

# Renders the public pages (front door, pricing, privacy, terms) into static
# files and checks the result, so the site cannot silently break.
#
# It builds here and deploys to **Cloudflare Pages**, and the split is the
# point: Cloudflare's build image has no Python, while this job already had a
# working interpreter — the site is rendered in Actions and the finished
# directory is handed over, so the host never needs to run any of it.
#
# It was written for GitHub Pages first, and Pages is not available at all for
# this repository: it is private and the owner is on GitHub's free plan, so the
# API answers `422 Your current plan does not support GitHub Pages for this
# repository`. Both original runs proved the *build* was fine and failed on that
# one plan restriction, with no workflow setting able to fix it.
#
# Two repository secrets turn the publish on:
#
#   CLOUDFLARE_API_TOKEN   — "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard's URL or Overview
#
# `CLOUDFLARE_ACCOUNT_ID` is set and `CLOUDFLARE_API_TOKEN` is not, which is the
# state this workflow spent four commits in. So the rule here is that an
# unpublished commit must not look like a published one: with no token the deploy
# job emits a warning and a job summary saying *this commit did not reach the
# site*, rather than a notice — a notice does not appear on the checks list, and
# the run still reads "success", which is true of the build and false of the
# deploy. With a token that the API rejects, the job fails before wrangler starts,
# naming the secret and where to rotate it: an expired token otherwise surfaces as
# an opaque 401 from inside a third-party action.
#
# And a successful upload is not the same claim as a published site, so the last
# step asks Cloudflare which commit production is serving and fails if it is not
# this one. `wrangler pages deploy` exiting 0 means the upload was accepted; the
# site sat four commits behind a green workflow precisely because nothing checked
# the difference.
#
# The build is worth running even unpublished: `scripts/build_site.py` is where
# every root-relative URL is rewritten, and a single one that survives is a 404
# on a static host — including the cat cursor, which fails with the system arrow
# and nothing in any console. The artifact is uploaded either way, so the site
# can also be published by hand or by any host that takes a directory.

on:
  push:
    branches: [main]
    paths:
      - "templates/home.html"
      - "templates/pricing.html"
      - "templates/legal.html"
      - "static/**"
      - "scripts/build_site.py"
      - "keep_alive.py"
      # Every module the pages actually read, not just the policy renderer.
      # `discord_auth` is where the invite link is built and `features` is where
      # the feature cards come from, so a change to either changes the rendered
      # page — and the check below asserts the invite link is present, which is
      # exactly the kind of edit that would need this job to run. Listing
      # `webdocs.py` alone was the narrow version of this list, and it missed a
      # real change: the invite permissions were narrowed without the site
      # being rebuilt or verified, because nothing here matched.
      - "console/**"
      - "scripts/build_owner.py"
      - "utils/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the static site
        env:
          # The invite link is built from this at render time. Public value: it
          # is in every invite URL. Override with a repository *variable* of the
          # same name if the application id ever changes.
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || '1548380269776605324' }}
          # The site's public address, used only to write sitemap.xml. A
          # Cloudflare Pages project is served from the root of its own hostname,
          # so there is no /<repo>/ prefix here — that subpath is what GitHub
          # *project* sites use, and it is still what the rewriting in
          # build_site.py is written to survive, which keeps the output
          # deployable to either.
          SITE_URL: ${{ vars.SITE_URL || 'https://meow-bot.pages.dev' }}
          # Where the paid cards send a buyer. Public checkout links, so they
          # live in repository *variables* rather than secrets; set them once and
          # both hosts sell the same thing. Without them this copy of the page
          # says "No billing yet" while the Render one charges — two hosts giving
          # a visitor two different answers about the same product.
          LEMONSQUEEZY_CHECKOUT_PRO: ${{ vars.LEMONSQUEEZY_CHECKOUT_PRO }}
          LEMONSQUEEZY_CHECKOUT_ENTERPRISE: ${{ vars.LEMONSQUEEZY_CHECKOUT_ENTERPRISE }}
          # Buying is off unless this is 1. Kept alongside the links so a build
          # here cannot start selling while the bot's own host has it switched
          # off — the two hosts publish the same page to the same visitors.
          PLAN_CHECKOUT: ${{ vars.PLAN_CHECKOUT }}
        # The builder exits non-zero if any root-relative URL survives its
        # rewrite, so a link that would 404 on a static host fails the job here
        # rather than in a visitor's browser.
        run: python scripts/build_site.py --out _site --proxy

      - name: Warn when this build intends to sell but cannot
        # A warning rather than a failure: the site is published from a workflow
        # the operator may not have finished configuring, and blocking every
        # deploy on a variable is how a working site goes stale. It fires only
        # when selling is *switched on* and the page still has no way to pay —
        # the state that is a mistake. A build with buying off is not missing
        # anything; it is doing what it was told, and saying so every push would
        # be noise that trains the warning away.
        env:
          PLAN_CHECKOUT: ${{ vars.PLAN_CHECKOUT }}
        run: |
          if [ "${PLAN_CHECKOUT:-}" != "1" ]; then
            echo "Buying is off (PLAN_CHECKOUT is not 1), so this copy has no Buy button by design."
          elif grep -q "No billing yet" _site/pricing.html; then
            echo "::warning title=Selling is on but there is no checkout link::PLAN_CHECKOUT is 1 and this build has no LEMONSQUEEZY_CHECKOUT_PRO / _ENTERPRISE, so /pricing advertises the tiers and cannot take a payment. Set both as repository variables and re-run."
          fi

      - name: Check the build did not lose its call to action
        # The templates omit the invite button when no client id is known, so a
        # build without one is not an error anywhere — it is a landing page that
        # silently cannot add the bot. That is the failure this step catches.
        run: |
          grep -q "discord.com/oauth2/authorize" _site/index.html || {
            echo "::error::the built front page has no invite link (is DISCORD_CLIENT_ID set?)"
            exit 1
          }

      - name: Check the published copy carries its security headers and proxy worker
        # A static host has no Flask, so the CSP, frame denial and HSTS the bot
        # serves come from `_headers` or from nowhere at all. Without this step a
        # build that dropped the file would deploy the least-protected copy of
        # the pages that ask a stranger to install a bot — and nothing on either
        # side would look wrong.
        run: |
          test -f _site/_headers
          grep -q "Content-Security-Policy" _site/_headers
          grep -q "frame-ancestors 'none'" _site/_headers
          test -f _site/_redirects
          test -f _site/_worker.js
          test -f _site/_routes.json

      - name: Check the cat cursor is still fetchable
        # A cursor image that 404s is invisible everywhere except to a person
        # noticing that their pointer is a plain arrow.
        run: |
          test -f _site/static/cursor-default.svg
          test -f _site/static/cursor-pointer.svg
          grep -q "cursor-default.svg" _site/static/meow.css

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: _site

      # Secrets cannot be read from a job-level `if`, so the check is a step: a
      # repository with no Cloudflare credentials gets a green run, not a red mark
      # on every push for a host nobody has connected yet.
      #
      # What it must not be is *quiet*, and the first version was nothing else: a
      # single `::notice`, which does not appear on the checks list at all. Four
      # consecutive `Site` runs reported success while `meow-bot.pages.dev`
      # served commit `0af327e` — from before all four of them — and nothing in any
      # of those runs said so. Every build guard passed, because every build guard
      # is about the build, which was fine. The one signal reaching a person read
      # "success": true of the build, false of the deploy, and with nowhere to
      # notice the difference. It is a warning on the run and a summary on the job
      # now, and the summary names the token and the command that fixes it.
      - name: Is Cloudflare configured?
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=This commit was NOT published::CLOUDFLARE_API_TOKEN is not set, so the publish step was skipped and the site still serves an older commit. Create a token with 'Cloudflare Pages: Edit' for account ${ACCOUNT_ID} at https://dash.cloudflare.com/profile/api-tokens, then run: gh secret set CLOUDFLARE_API_TOKEN --repo ${GITHUB_REPOSITORY}"
            {
              echo "## Published: **no**"
              echo
              echo "This commit built and passed every check, and it never reached"
              echo "<https://meow-bot.pages.dev>. The \`CLOUDFLARE_API_TOKEN\`"
              echo "secret is not set, so the publish step was skipped and the live"
              echo "copy still serves an older commit."
              echo
              echo "**One-time setup.** Create a token with **Cloudflare Pages:"
              echo "Edit** for account \`${ACCOUNT_ID}\` at"
              echo "<https://dash.cloudflare.com/profile/api-tokens>, then:"
              echo
              echo '```sh'
              echo "gh secret set CLOUDFLARE_API_TOKEN --repo ${GITHUB_REPOSITORY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Set but unusable is worse than absent: an expired or revoked token
          # fails the publish *after* wrangler has started, as an opaque error
          # from inside a third-party action. Asked here, the answer is a sentence
          # that names what is missing — and there are three different ways this
          # token can be wrong, each one measured against the live API for this
          # account rather than assumed:
          #
          #   * account-owned    — `/user/tokens/verify` answers **401** for those
          #                        by design, so a check built on it red-fails a
          #                        token that works;
          #   * read-only        — every GET succeeds and the project reads fine
          #                        (`Pages Read` answers 200), while the publish
          #                        dies as `Authentication error [code: 10000]`.
          #                        That is exactly what this repository's token
          #                        did, on the first real run;
          #   * no account id    — the Pages project cannot even be named.
          #
          # So the question asked is the one the publish actually asks, a step
          # earlier: a Pages **upload token**. It creates nothing, publishes
          # nothing and mints only the short-lived credential the upload would
          # use — so it exercises no authority the next step does not already
          # have — and a token without `Pages Write` is refused here, by name,
          # instead of as a wrangler stack trace.
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error title=The Cloudflare account id is missing::CLOUDFLARE_API_TOKEN is set but CLOUDFLARE_ACCOUNT_ID is not, so the Pages project cannot even be named. Both are needed: gh secret set CLOUDFLARE_ACCOUNT_ID --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          token_status=$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          read_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/meow-bot" || echo 000)
          publish_status=$(curl -sS -o /tmp/cf-upload.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/meow-bot/upload-token" || echo 000)

          if [ "$publish_status" != "200" ]; then
            if [ "$read_status" = "200" ]; then
              reason="this looks like a missing permission rather than a dead token: it can read the Pages project but not publish to it"
              remedy="Add **Cloudflare Pages: Edit** (the API calls the group 'Pages Write') to the token for account ${ACCOUNT_ID} at https://dash.cloudflare.com/profile/api-tokens, or mint a token that has it and run"
            elif [ "$token_status" = "401" ] && [ "$read_status" = "401" ]; then
              reason="the API refused it, so it is expired, revoked, or scoped to a different account"
              remedy="Rotate it at https://dash.cloudflare.com/profile/api-tokens, then run"
            else
              reason="the API answered ${publish_status} to the publish check and ${read_status} to the project read"
              remedy="Check the token's permissions and account at https://dash.cloudflare.com/profile/api-tokens, then run"
            fi
            echo "::error title=The Cloudflare token cannot publish::CLOUDFLARE_API_TOKEN is set, but ${reason}. Left alone this fails inside wrangler as 'Authentication error [code: 10000]', which reads as a broken site rather than as a missing permission. ${remedy}: gh secret set CLOUDFLARE_API_TOKEN --repo ${GITHUB_REPOSITORY} (token endpoint ${token_status}, project read ${read_status}, publish check ${publish_status})"
            cat /tmp/cf-upload.json 2>/dev/null || true
            exit 1
          fi
          if [ "$token_status" != "200" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is account-owned — the token endpoint answers ${token_status} for those by design, so the publish check is the one that decides, and it passed."
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` is what makes this a production deployment rather
          # than a preview URL. The project is created on the first run if it
          # does not exist yet.
          #
          # `--commit-hash` is explicit because this job downloads an artifact and
          # never checks out the repository — so wrangler finds no git repository,
          # attaches no commit, and the deployment becomes unattributable. The
          # manual deploys this project has had *were* from a checkout, which is
          # why they carry a commit and this one otherwise would not.
          #
          # The message is a fixed string rather than the head commit subject:
          # that value reaches a shell here, and a subject containing a quote or a
          # newline is a command injection in a workflow that holds a token.
          command: pages deploy _site --project-name=meow-bot --branch=main --commit-hash=${{ github.sha }} --commit-message="Deployed from GitHub Actions"

      - name: Check the deployment actually landed on this commit
        # `wrangler pages deploy` exiting 0 means Cloudflare *accepted* the upload.
        # That is not the same claim as "the site now serves this commit", and the
        # gap between the two is precisely how this workflow's publish went
        # unnoticed for four commits: accepted, green, stale. Asked of the API, the
        # two are one comparison.
        if: steps.cf.outputs.configured == 'true'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED: ${{ github.sha }}
        # The reader below is one line, not a readable multi-line script, and
        # that is load-bearing: a block scalar ends at the first line less
        # indented than the block, so an embedded program written across lines
        # has to be indented to match the block — which `python3 -c` then reads
        # as an unexpected indent on its first statement. One line cannot get
        # this wrong, and the alternative is a YAML parse error in a workflow
        # whose only symptom is that it never runs.
        run: |
          landed=""
          for attempt in 1 2 3 4 5; do
            landed=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/meow-bot/deployments?per_page=10" \
              | python3 -c 'import json,sys; rows=(json.load(sys.stdin).get("result") or []); prod=[r for r in rows if r.get("environment")=="production"]; meta=((prod[0].get("deployment_trigger") or {}).get("metadata") or {}) if prod else {}; print(meta.get("commit_hash") or "")' 2>/dev/null || echo "")
            if [ "$landed" = "$EXPECTED" ]; then
              break
            fi
            sleep 6
          done
          if [ "$landed" != "$EXPECTED" ]; then
            echo "::error title=The site did not take this commit::The newest production deployment reports commit '${landed}', not ${EXPECTED}. The upload was accepted but the live site is not this commit — check the deployment in the Cloudflare dashboard before trusting the URL."
            exit 1
          fi
          echo "Published ${EXPECTED} to https://meow-bot.pages.dev"

  deploy-owner:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the owner console
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || '1548380269776605324' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://meow-bot.pages.dev' }}
          LIVE_APP: ${{ vars.LIVE_APP || 'https://meow-discord-bot.onrender.com' }}
        run: python scripts/build_owner.py --out _owner

      - name: Check the build produced a worker
        run: test -f _owner/_worker.js

      # A step's `if` cannot read the `secrets` context at all — GitHub's
      # context-availability table allows `github, needs, strategy, matrix, job,
      # runner, env, vars, steps, inputs` there and nothing else — and writing it
      # anyway is not a step that never runs but a *workflow that never parses*:
      # every run since this line landed failed at validation with no jobs, no
      # logs, and "This run likely failed because of a workflow file issue". The
      # build guards above it never executed again either. So the secret is read
      # where secrets are legal (a step `env`) and the decision is made from an
      # output, which is a context an `if` may use — the same shape the `deploy`
      # job above already uses for the same reason.
      - name: Is Cloudflare configured?
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=This commit did not publish the owner console::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so _owner was built and its worker checked, but meow-owner.pages.dev still serves an older commit. gh secret set CLOUDFLARE_API_TOKEN --repo ${GITHUB_REPOSITORY}"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Publish owner console to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _owner --project-name=meow-owner --branch=main --commit-hash=${{ github.sha }} --commit-message="Deployed from GitHub Actions"
