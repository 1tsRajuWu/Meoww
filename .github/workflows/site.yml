name: Site

# Renders the public pages (front door, pricing, privacy, terms) into static
# files and checks the result, so the site cannot silently break.
#
# It builds here and deploys to **Cloudflare Pages**, and the split is the
# point: Cloudflare's build image has no Python, while this job already had a
# working interpreter — the site is rendered in Actions and the finished
# directory is handed over, so the host never needs to run any of it.
#
# It was written for GitHub Pages first, and Pages is not available at all for
# this repository: it is private and the owner is on GitHub's free plan, so the
# API answers `422 Your current plan does not support GitHub Pages for this
# repository`. Both original runs proved the *build* was fine and failed on that
# one plan restriction, with no workflow setting able to fix it.
#
# Two repository secrets turn the publish on; with neither set the deploy job
# skips with a notice rather than failing, so the checks below still guard every
# push:
#
#   CLOUDFLARE_API_TOKEN   — "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard's URL or Overview
#
# The build is worth running even unpublished: `scripts/build_site.py` is where
# every root-relative URL is rewritten, and a single one that survives is a 404
# on a static host — including the cat cursor, which fails with the system arrow
# and nothing in any console. The artifact is uploaded either way, so the site
# can also be published by hand or by any host that takes a directory.

on:
  push:
    branches: [main]
    paths:
      - "templates/home.html"
      - "templates/pricing.html"
      - "templates/legal.html"
      - "static/**"
      - "scripts/build_site.py"
      - "keep_alive.py"
      # Every module the pages actually read, not just the policy renderer.
      # `discord_auth` is where the invite link is built and `features` is where
      # the feature cards come from, so a change to either changes the rendered
      # page — and the check below asserts the invite link is present, which is
      # exactly the kind of edit that would need this job to run. Listing
      # `webdocs.py` alone was the narrow version of this list, and it missed a
      # real change: the invite permissions were narrowed without the site
      # being rebuilt or verified, because nothing here matched.
      - "utils/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the static site
        env:
          # The invite link is built from this at render time. Public value: it
          # is in every invite URL. Override with a repository *variable* of the
          # same name if the application id ever changes.
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID || '1548380269776605324' }}
          # The site's public address, used only to write sitemap.xml. A
          # Cloudflare Pages project is served from the root of its own hostname,
          # so there is no /<repo>/ prefix here — that subpath is what GitHub
          # *project* sites use, and it is still what the rewriting in
          # build_site.py is written to survive, which keeps the output
          # deployable to either.
          SITE_URL: ${{ vars.SITE_URL || 'https://meow-bot-site.pages.dev' }}
          # Where the paid cards send a buyer. Public checkout links, so they
          # live in repository *variables* rather than secrets; set them once and
          # both hosts sell the same thing. Without them this copy of the page
          # says "No billing yet" while the Render one charges — two hosts giving
          # a visitor two different answers about the same product.
          LEMONSQUEEZY_CHECKOUT_PRO: ${{ vars.LEMONSQUEEZY_CHECKOUT_PRO }}
          LEMONSQUEEZY_CHECKOUT_ENTERPRISE: ${{ vars.LEMONSQUEEZY_CHECKOUT_ENTERPRISE }}
        # The builder exits non-zero if any root-relative URL survives its
        # rewrite, so a link that would 404 on a static host fails the job here
        # rather than in a visitor's browser.
        run: python scripts/build_site.py --out _site --proxy

      - name: Warn when this copy cannot sell
        # A warning rather than a failure: the site is published from a workflow
        # the operator may not have finished configuring, and blocking every
        # deploy on a variable is how a working site goes stale. Silence is the
        # thing to avoid, because the two hosts would then disagree in public.
        run: |
          if grep -q "No billing yet" _site/pricing.html; then
            echo "::warning title=Checkout is not configured::This build has no LEMONSQUEEZY_CHECKOUT_PRO or _ENTERPRISE, so its pricing page says 'No billing yet' while the bot's own host may be selling. Set both as repository variables and re-run."
          fi

      - name: Check the build did not lose its call to action
        # The templates omit the invite button when no client id is known, so a
        # build without one is not an error anywhere — it is a landing page that
        # silently cannot add the bot. That is the failure this step catches.
        run: |
          grep -q "discord.com/oauth2/authorize" _site/index.html || {
            echo "::error::the built front page has no invite link (is DISCORD_CLIENT_ID set?)"
            exit 1
          }

      - name: Check the published copy carries its security headers and proxy worker
        # A static host has no Flask, so the CSP, frame denial and HSTS the bot
        # serves come from `_headers` or from nowhere at all. Without this step a
        # build that dropped the file would deploy the least-protected copy of
        # the pages that ask a stranger to install a bot — and nothing on either
        # side would look wrong.
        run: |
          test -f _site/_headers
          grep -q "Content-Security-Policy" _site/_headers
          grep -q "frame-ancestors 'none'" _site/_headers
          test -f _site/_redirects
          test -f _site/_worker.js
          test -f _site/_routes.json

      - name: Check the cat cursor is still fetchable
        # A cursor image that 404s is invisible everywhere except to a person
        # noticing that their pointer is a plain arrow.
        run: |
          test -f _site/static/cursor-default.svg
          test -f _site/static/cursor-pointer.svg
          grep -q "cursor-default.svg" _site/static/meow.css

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: _site

      # Secrets cannot be read from a job-level `if`, so the check is a step:
      # a repository with no Cloudflare credentials gets a notice and a green
      # run, not a red mark on every push for a host nobody has connected yet.
      - name: Is Cloudflare configured?
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — built the site but did not publish it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` is what makes this a production deployment rather
          # than a preview URL. The project is created on the first run if it
          # does not exist yet.
          command: pages deploy _site --project-name=meow-bot-site --branch=main
