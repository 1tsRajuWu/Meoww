name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also runnable by hand: the file is only executed from the default branch (or
  # a PR against it), so this is the one way to prove a change to *this* job
  # before merging it.
  workflow_dispatch:

concurrency:
  # A suite that hangs used to leave every push piled up behind it: fourteen runs
  # were "in progress" at once, none of them publishable and none of them
  # cancelled. A newer push supersedes an older one — nothing is lost, because
  # the point of this job is the newest commit.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Belt and braces under the in-process watchdog below: whatever holds the
    # suite, the job ends. GitHub's own ceiling is six hours, which is why this
    # was invisible rather than red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        # Not plain `unittest discover`, which exits 0 when every test it finds
        # skips — a green check has to mean the suite *ran*, not that nothing
        # failed among the tests that chose to run. The floor is the number of
        # tests that must actually execute (2,200 of the 3,296 collected today),
        # and the skip budget is **zero plus headroom**: the suite used to carry
        # eleven skips, nine of them retired command-sync tests and two for a
        # music cog that had been removed — and both are gone, because the cog
        # came back rebuilt and the retired tests were replaced rather than
        # parked. It then carried forty-one, and that is the number this comment
        # never saw: two classes retired by the dashboard rebuild (thirty-nine
        # skips between them) plus a retired module, none of which could go red,
        # because the job stopped on six failures before this check was reached.
        # The parked classes are deleted — their replacements are
        # `tests/test_dashboard_pages.py`, and a law that is skipped is a law
        # nobody reads — leaving one retired module whose reason travels in
        # `tests/test_shell.py` and one genuine platform skip (starlette is
        # installed where the Space runs, not in this job). The budget stays at
        # ten rather than at zero so that a platform skip does not go red, while
        # a batch of tests quietly skipping still does. A rename that stops
        # discovery matching is the other failure this step exists to catch, and
        # the floor is what catches it.
        run: |
          python - <<'PY'
          import faulthandler
          import sys
          import unittest

          # A hang is the one failure that leaves no evidence. Without this, the
          # suite that blocked on the runner sat at "Run test suite" until
          # GitHub's six-hour ceiling: no log was published, the check never went
          # red, and every later push queued behind it. Two minutes is far longer
          # than the whole suite takes (~25s locally, under a minute on a cold
          # runner) and short enough to read a log: every thread's stack is dumped
          # and the process exits non-zero.
          faulthandler.dump_traceback_later(120, exit=True)

          FLOOR = 2200
          SKIP_BUDGET = 10

          result = unittest.TextTestRunner(verbosity=1).run(
              unittest.defaultTestLoader.discover("tests", top_level_dir=".")
          )
          ran = result.testsRun - len(result.skipped)
          print(
              f"\n{ran} test(s) ran, {len(result.skipped)} skipped, "
              f"{result.testsRun} collected in total"
          )
          if not result.wasSuccessful():
              sys.exit("the suite failed")
          if ran < FLOOR:
              sys.exit(
                  f"only {ran} test(s) ran (floor {FLOOR}) — "
                  "did discovery stop matching the suite?"
              )
          if len(result.skipped) > SKIP_BUDGET:
              sys.exit(
                  f"{len(result.skipped)} test(s) skipped (budget {SKIP_BUDGET}) — "
                  "retest or delete the ones that no longer run"
              )
          PY
