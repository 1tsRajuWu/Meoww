name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Also runnable by hand: the file is only executed from the default branch (or
  # a PR against it), so this is the one way to prove a change to *this* job
  # before merging it.
  workflow_dispatch:

concurrency:
  # A suite that hangs used to leave every push piled up behind it: fourteen runs
  # were "in progress" at once, none of them publishable and none of them
  # cancelled. A newer push supersedes an older one — nothing is lost, because
  # the point of this job is the newest commit.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Belt and braces under the in-process watchdog below: whatever holds the
    # suite, the job ends. GitHub's own ceiling is six hours, which is why this
    # was invisible rather than red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        # Not plain `unittest discover`, which exits 0 when every test it finds
        # skips — a green check has to mean the suite *ran*, not that nothing
        # failed among the tests that chose to run. The floor is the number of
        # tests that must actually execute (~769 of 780 collected today), and the
        # skip budget is the eleven known skips: nine retired command-sync tests
        # and two modules for a music cog that is no longer in the tree. A rename
        # that stops discovery matching, or a batch of tests that quietly starts
        # skipping, is the failure this step exists to catch.
        run: |
          python - <<'PY'
          import faulthandler
          import sys
          import unittest

          # A hang is the one failure that leaves no evidence. Without this, the
          # suite that blocked on the runner sat at "Run test suite" until
          # GitHub's six-hour ceiling: no log was published, the check never went
          # red, and every later push queued behind it. Two minutes is far longer
          # than the whole suite takes (~15s) and short enough to read a log:
          # every thread's stack is dumped and the process exits non-zero.
          faulthandler.dump_traceback_later(120, exit=True)

          FLOOR = 740
          SKIP_BUDGET = 20

          result = unittest.TextTestRunner(verbosity=1).run(
              unittest.defaultTestLoader.discover("tests", top_level_dir=".")
          )
          ran = result.testsRun - len(result.skipped)
          print(
              f"\n{ran} test(s) ran, {len(result.skipped)} skipped, "
              f"{result.testsRun} collected in total"
          )
          if not result.wasSuccessful():
              sys.exit("the suite failed")
          if ran < FLOOR:
              sys.exit(
                  f"only {ran} test(s) ran (floor {FLOOR}) — "
                  "did discovery stop matching the suite?"
              )
          if len(result.skipped) > SKIP_BUDGET:
              sys.exit(
                  f"{len(result.skipped)} test(s) skipped (budget {SKIP_BUDGET}) — "
                  "retest or delete the ones that no longer run"
              )
          PY
