<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Admin Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090c10;
            --surface: rgba(18, 22, 31, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #5865F2;
            --accent-glow: rgba(88, 101, 242, 0.4);
            --text-primary: #f0f3f8;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 50% 20%, rgba(88, 101, 242, 0.18) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(235, 69, 158, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .bot-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #5865F2, #eb459e);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            font-family: "JetBrains Mono", monospace;
            outline: none;
            transition: all 0.2s;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #5865F2, #4752c4);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--accent-glow);
        }

        .error-banner {
            background: rgba(242, 63, 67, 0.15);
            border: 1px solid rgba(242, 63, 67, 0.3);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hint {
            margin-top: 22px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="bot-avatar">🐾</div>
        <h1>Meow Admin Portal</h1>
        <p>Enter your secret admin passkey or use <code>/dashboard</code> in Discord for a 1-click magic link.</p>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="input-group">
                <label for="passkey">Admin Passkey</label>
                <input type="password" id="passkey" name="passkey" placeholder="••••••••••••" required autofocus>
            </div>
            <button type="submit" class="btn-submit">Authenticate ⚡</button>
        </form>

        <div class="hint">
            Tip: In Discord, administrators can run <code>/dashboard</code> to generate an instant login button.
        </div>
    </div>
</body>
</html>
