<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building The Market — {{ bot_name }}</title>
<meta name="description" content="A completely redesigned market experience is currently being built.">
<meta name="theme-color" content="#060609">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --brb-bg: #060609;
    --brb-text: #ffffff;
    --brb-text-muted: rgba(255, 255, 255, 0.5);
    --brb-red: #ff2a44;
    --brb-red-glow: rgba(255, 42, 68, 0.4);
    --brb-good: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background-color: var(--brb-bg);
    color: var(--brb-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    position: relative;
  }

  /* Interactive Gravity Dots Canvas */
  #dots-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient atmospheric background */
  .ambient-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, rgba(255, 42, 68, 0.18) 0%, rgba(220, 38, 38, 0.08) 45%, transparent 70%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }

  /* Center Stage Container */
  .stage {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  /* Pill Tag */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 42, 68, 0.06);
    border: 1px solid rgba(255, 42, 68, 0.22);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brb-red);
    box-shadow: 0 0 10px var(--brb-red), 0 0 20px var(--brb-red-glow);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }

  /* Typography */
  .title {
    font-size: clamp(2.4rem, 5vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.08;
    margin-bottom: 14px;
    background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.65) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 15px;
    line-height: 1.6;
    color: var(--brb-text-muted);
    max-width: 400px;
    margin: 0 auto;
    font-weight: 400;
  }

  /* Laser Progress Bar */
  .laser-track {
    width: 140px;
    height: 2px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
    margin: 28px auto 32px;
  }
  .laser-bar {
    position: absolute;
    top: 0;
    left: -60%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #ff2a44, #ff6b81, transparent);
    animation: laser-slide 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes laser-slide {
    0% { left: -60%; }
    100% { left: 100%; }
  }

  /* Action Buttons */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
  }
  .btn-white {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 999px;
    background: #ffffff;
    color: #060609;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.2);
  }
  .btn-white:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--brb-red-glow), 0 0 0 1px rgba(255, 255, 255, 0.4);
    color: #000000;
  }
  .btn-white:active {
    transform: translateY(0);
  }

  /* Footer Note */
  .meta-note {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.02em;
    margin-top: 8px;
  }
  .meta-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brb-good);
    box-shadow: 0 0 8px var(--brb-good);
  }
</style>
</head>
<body>
  <canvas id="dots-canvas" aria-hidden="true"></canvas>
  <div class="ambient-glow"></div>

  <main class="stage">
    <div class="status-pill">
      <span class="pulse-dot"></span>
      Under Construction
    </div>

    <h1 class="title">Building The Market.</h1>

    <p class="subtitle">
      A completely redesigned market and trading terminal is currently being built. All balances and portfolios remain secure.
    </p>

    <div class="laser-track" aria-hidden="true">
      <div class="laser-bar"></div>
    </div>

    <div class="actions">
      {% if invite_url %}
      <a class="btn-white" href="{{ invite_url }}">
        Discord Commands Available →
      </a>
      {% endif %}

      <div class="meta-note">
        <span class="meta-dot"></span>
        <span>Ledger &amp; Portfolio Database Secured</span>
      </div>
    </div>
  </main>

  <script>
  (function() {
    var canvas = document.getElementById('dots-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var width = 0, height = 0, dpr = 1;
    var dots = [];
    var SPACING = 36;
    var INFLUENCE_RADIUS = 140;
    var MOUSE_FORCE = 7;
    var SPRING = 0.075;
    var DAMPING = 0.83;

    var mouse = { x: -9999, y: -9999, targetX: -9999, targetY: -9999, active: false };
    var shockwaves = [];

    function Dot(x, y) {
      this.originX = x;
      this.originY = y;
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.size = 1.35;
      this.phase = Math.random() * Math.PI * 2;
    }

    Dot.prototype.update = function(time) {
      var wave = Math.sin(time * 0.0018 + this.phase) * 0.7;
      var targetX = this.originX;
      var targetY = this.originY + wave;

      if (mouse.active) {
        var dx = mouse.x - this.x;
        var dy = mouse.y - this.y;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < INFLUENCE_RADIUS && dist > 0) {
          var force = (1 - dist / INFLUENCE_RADIUS);
          var power = force * force * MOUSE_FORCE;
          var angle = Math.atan2(dy, dx);
          this.vx -= Math.cos(angle) * power;
          this.vy -= Math.sin(angle) * power;
        }
      }

      for (var i = 0; i < shockwaves.length; i++) {
        var sw = shockwaves[i];
        var sdx = this.x - sw.x;
        var sdy = this.y - sw.y;
        var sdist = Math.sqrt(sdx * sdx + sdy * sdy);
        var waveDist = Math.abs(sdist - sw.radius);
        if (waveDist < sw.width) {
          var spower = (1 - waveDist / sw.width) * sw.strength;
          var sangle = Math.atan2(sdy, sdx);
          this.vx += Math.cos(sangle) * spower;
          this.vy += Math.sin(sangle) * spower;
        }
      }

      this.vx += (targetX - this.x) * SPRING;
      this.vy += (targetY - this.y) * SPRING;

      this.vx *= DAMPING;
      this.vy *= DAMPING;

      this.x += this.vx;
      this.y += this.vy;
    };

    Dot.prototype.draw = function(ctx) {
      var cx = width / 2;
      var cy = height / 2;
      var dx = this.x - cx;
      var dy = this.y - cy;
      var distFromCenter = Math.sqrt(dx * dx + dy * dy);
      var maxDist = Math.sqrt(cx * cx + cy * cy);
      var vignette = Math.max(0, 1 - Math.pow(distFromCenter / maxDist, 1.4));

      var mouseProximity = 0;
      if (mouse.active) {
        var mdx = mouse.x - this.x;
        var mdy = mouse.y - this.y;
        var mDist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mDist < INFLUENCE_RADIUS) {
          mouseProximity = 1 - mDist / INFLUENCE_RADIUS;
        }
      }

      var alpha = (0.12 + mouseProximity * 0.65) * vignette;
      if (alpha <= 0.01) return;

      var r = this.size + mouseProximity * 1.6;

      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);

      if (mouseProximity > 0.35) {
        ctx.fillStyle = 'rgba(255, 42, 68, ' + alpha + ')';
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
      }
      ctx.fill();
    };

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      dots = [];
      var cols = Math.ceil(width / SPACING) + 1;
      var rows = Math.ceil(height / SPACING) + 1;
      var offsetX = (width - (cols - 1) * SPACING) / 2;
      var offsetY = (height - (rows - 1) * SPACING) / 2;

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          dots.push(new Dot(offsetX + c * SPACING, offsetY + r * SPACING));
        }
      }
    }

    function onPointerMove(e) {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
      mouse.active = true;
    }

    function onPointerLeave() {
      mouse.active = false;
    }

    function onClick(e) {
      shockwaves.push({
        x: e.clientX,
        y: e.clientY,
        radius: 0,
        maxRadius: 280,
        width: 50,
        strength: 9
      });
    }

    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onClick, { passive: true });
    document.addEventListener('mouseleave', onPointerLeave);

    resize();

    function animate(time) {
      requestAnimationFrame(animate);

      if (mouse.active) {
        mouse.x += (mouse.targetX - mouse.x) * 0.35;
        mouse.y += (mouse.targetY - mouse.y) * 0.35;
      }

      for (var i = shockwaves.length - 1; i >= 0; i--) {
        var sw = shockwaves[i];
        sw.radius += 8;
        sw.strength *= 0.94;
        if (sw.radius > sw.maxRadius) {
          shockwaves.splice(i, 1);
        }
      }

      ctx.clearRect(0, 0, width, height);

      for (var j = 0; j < dots.length; j++) {
        dots[j].update(time);
        dots[j].draw(ctx);
      }
    }

    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
