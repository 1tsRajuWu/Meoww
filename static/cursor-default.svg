<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The ordinary pointer: a paw, because the product is a cat. Drawn rather
       than picked, with the shared accent (#5b5ef0) in the pad so the cursor
       belongs to the same palette as everything behind it. The hotspot in
       `meow.css` is (6, 2) — the top-left toe — so the paw's "point" lands
       where an arrow's tip would. -->
  <g transform="translate(1 3)">
    <g fill="#f4f2ef" stroke="#0c0c0d" stroke-width="1.4" stroke-linejoin="round">
      <ellipse cx="15" cy="19" rx="9" ry="8" />
      <circle cx="6" cy="9" r="3.4" />
      <circle cx="12" cy="5" r="3.4" />
      <circle cx="19.5" cy="5.5" r="3.4" />
      <circle cx="25" cy="10.5" r="3.4" />
    </g>
    <ellipse cx="15" cy="19.5" rx="4.7" ry="4.3" fill="#5b5ef0" opacity="0.92" />
  </g>
</svg>
