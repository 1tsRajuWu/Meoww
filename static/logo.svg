<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Meow">
  <!--
    A cat's head as one silhouette: a round face and two ears that meet in the
    dip between them. Three primitives, one hue, no outline.

    The mark it replaces was a gradient face carrying inner ears, two eye
    whites with pupils, a muzzle, a nose, whiskers and a mouth — nine elements
    at three sizes, which at the 20-22px the header actually renders it is
    mud: every detail collapses into the gradient and the whole thing reads as
    a coloured blob. What is left is the *shape* of a cat, which is the part
    that still says "cat" when it is 20 pixels wide, in one flat colour so it
    can never argue with whatever surface it sits on.
  -->
  <g fill="#5b5ef0">
    <path d="M12 13 L14.5 4 L20 11 L25.5 4 L28 13 Z" />
    <circle cx="20" cy="22" r="12" />
  </g>
  <!-- Eyes and nose are cut in the page's background colour rather than drawn
       on top of it: at small sizes a negative-space eye stays a clean dot,
       where a filled one with a stroke becomes a smudge. -->
  <g fill="#0c0c0d">
    <circle cx="15.4" cy="20.4" r="1.75" />
    <circle cx="24.6" cy="20.4" r="1.75" />
    <path d="M20 25.4 L18.5 23.7 L21.5 23.7 Z" />
  </g>
</svg>
