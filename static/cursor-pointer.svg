<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The pressable cursor: the hand everybody already recognises, with the
       brand's wedge on the palm where the dot used to be. Same two-part rule as
       the default cursor, and the same reason the node is a shape rather than a
       circle — the mark is the one thing this pair has to say. -->
